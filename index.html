<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saúde a Dois">
<title>Saúde a Dois</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lockscr">
  <img class="cover" alt="Capa do aplicativo" src="capa.jpg">
  <h2 id="lockt" style="margin:0">Saúde a Dois</h2>
  <div id="locks" class="mut" style="color:#dfe3f5"></div>
  <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">
  <button class="btn" style="background:#fff;color:var(--pri)" onclick="unlock()">Entrar</button>
  <div class="mut" style="color:#dfe3f5;max-width:300px">Protótipo: o PIN fica só neste aparelho e não é segurança real. A versão final usaria criptografia e biometria.</div>
</div>

<header>
  <img class="logo" alt="" src="icon-192.png">
  <h1>Saúde a Dois</h1>
  <div class="seg" id="seg">
    <button data-p="douglas" class="on">Douglas</button>
    <button data-p="rodrigo">Rodrigo</button>
  </div>
  <button class="lock" onclick="goTab('google')" aria-label="Google" title="Google">☁</button>
  <button class="lock" onclick="lockNow()" aria-label="Bloquear">🔒</button>
</header>

<main id="view"></main>

<nav id="nav">
  <button data-t="resumo" class="on"><span class="i">🏠</span>Resumo</button>
  <button data-t="exames"><span class="i">🧪</span>Exames</button>
  <button data-t="importar"><span class="i">📄</span>Importar</button>
  <button data-t="diario"><span class="i">📓</span>Diário</button>
  <button data-t="agenda"><span class="i">📅</span>Agenda</button>
  <button data-t="consulta"><span class="i">🩺</span>Consulta</button>
  <button data-t="remedios"><span class="i">💊</span>Em uso</button>
</nav>

<script src="config.js"></script>
<script src="pdf.min.js"></script>
<script src="google.js"></script>
<script src="app.js"></script>
</body>
</html>
